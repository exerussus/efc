[workspace]
resolver = "2"
members = ["crates/efc-core", "crates/efc"]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.75"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
